services:
  # 1. Database Layer
  db:
    image: postgres:15-alpine
    container_name: as-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Cache Layer
  redis:
    image: redis:7-alpine
    container_name: as-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Migration Runner (Init Container)
  migration_init:
    build: ./backend
    image: autosprint-backend
    container_name: as-migration-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: ["alembic", "upgrade", "heads"]

  # 4. AI Layer
  # Optional. By default the backend talks to an Ollama running on the host
  # (host.docker.internal:11434). To run Ollama inside Docker instead, start with
  # `docker compose --profile docker-ollama up` and set
  # OLLAMA_URL=http://ollama:11434/api/generate in .env.
  ollama:
    image: ollama/ollama
    profiles: ["docker-ollama"]
    container_name: as-ollama
    restart: always
    ports:
      - "11439:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 5. Backend Layer
  backend:
    build: ./backend
    image: autosprint-backend
    container_name: as-backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8009:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration_init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - OLLAMA_THINK=${OLLAMA_THINK:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3009}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend:/app

  # 6. Celery Worker Layer
  celery_worker:
    build: ./backend
    image: autosprint-backend
    container_name: as-celery-worker
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "celery_app.celery_app", "worker", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration_init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - OLLAMA_THINK=${OLLAMA_THINK:-}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./backend:/app

  # 7. Frontend Layer
  frontend:
    build: ./frontend
    image: autosprint-frontend
    container_name: as-frontend
    ports:
      - "3009:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  ollama_data: